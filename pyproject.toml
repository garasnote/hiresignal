[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiresignal"
version = "0.2.0"
description = "A job-market warehouse: ATS harvest -> DuckDB star schema -> SQL marts -> dashboard"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ats = ["duckdb>=1.0", "pyarrow>=15"]
dev = ["ruff>=0.6", "pytest>=7"]

[tool.setuptools]
packages = ["pipeline", "dashboard"]
py-modules = []

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Same philosophy as the rag repo: every failure is a defect, not a style opinion.
select = ["E4", "E7", "E9", "F", "I", "B"]
