name: 'hiresignal'
version: '1.0.0'
config-version: 2
profile: 'hiresignal'

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  postings_parquet: "~/Documents/JobApp/portfolio/hiresignal/data/sample/postings.parquet"

models:
  hiresignal:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
