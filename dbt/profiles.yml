hiresignal:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relative to the project directory (dbt/), so the same profile works on a
      # laptop and on a CI runner, where no absolute path can survive.
      path: "{{ env_var('DBT_DUCKDB_PATH', '../data/hiresignal_dbt.duckdb') }}"
      threads: 4
