name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-lint:
    name: compileall + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install ruff

      # Byte-compiles without importing: catches syntax errors in the scripts no
      # test touches (harvest, dedupe, snapshot).
      - name: Byte-compile the pipelines and the dashboard
        run: python -m compileall -q pipeline dashboard scripts

      # A public repo must not carry anyone's home directory, least of all mine.
      - name: No absolute local paths
        run: |
          if git grep -n -I -E '/(home|Users)/[A-Za-z0-9._-]+' -- . ; then
            echo "::error::absolute local path committed; use a relative path or env_var()"
            exit 1
          fi

      - name: ruff check
        run: |
          python -m ruff --version
          python -m ruff check .

  dbt-build:
    name: dbt build (sample corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-duckdb
        run: pip install "dbt-duckdb>=1.8,<2"

      # The whole star schema plus 25 data tests, against the 5.5k-row sample
      # that ships with the repo. A broken model or a failed test blocks the merge.
      - name: dbt build
        working-directory: dbt
        run: |
          dbt build --profiles-dir . --project-dir . \
            --vars 'postings_parquet: ../data/sample/postings.parquet'
