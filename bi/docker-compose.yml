# Metabase on top of warehouse.db
#   docker compose up -d   ->  http://localhost:3033
# First start: create the admin user, then add a database:
#   engine: SQLite, file: /data/warehouse.db (read-only mount below)
services:
  metabase:
    image: metabase/metabase:latest
    container_name: market-metabase
    ports:
      - "3033:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
      - ../warehouse.db:/data/warehouse.db:ro
    restart: unless-stopped

volumes:
  metabase-data:
